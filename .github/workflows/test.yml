name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
      - name: Install dev-dependencies
        run: npm ci --only=dev
      - name: Run test
        run: npm run test
